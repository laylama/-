<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1320"><title>找不同</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0d1320;color:#f4f7ff}
*{box-sizing:border-box}body{margin:0}main{width:min(100%,620px);margin:auto;padding:18px 13px 36px;display:grid;gap:12px}
section{background:#172235;border:1px solid #2e4057;border-radius:18px;padding:14px;box-shadow:0 7px 20px #070c1630}
h1{font-size:19px;margin:0 0 13px;font-weight:800;letter-spacing:-.02em}h2{font-size:16px;margin:0;font-weight:760}
.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;background:#286fc2;color:#fff;font-size:17px;font-weight:800;border-radius:14px;padding:18px 12px;cursor:pointer;min-height:72px;overflow:hidden}.upload:active{opacity:.8}.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.field{display:flex;align-items:center;gap:5px;font-size:12px;color:#c3d1e2;white-space:nowrap}.field input{width:53px;border:1px solid #405574;background:#0d182a;color:#fff;border-radius:9px;padding:7px 3px;font-size:16px;text-align:center;font-variant-numeric:tabular-nums}.field input:focus{outline:2px solid #79bbff}
#status{font-size:12px;color:#9eb1cb;margin:9px 2px 0;min-height:17px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:10px;flex-wrap:wrap}.count{font-size:12px;color:#b1f1d2;font-variant-numeric:tabular-nums}
.placeholder{border:1px dashed #405575;border-radius:12px;min-height:185px;display:flex;align-items:center;justify-content:center;color:#8398b4;font-size:14px;text-align:center;padding:20px}
#result{display:none;width:100%;height:auto;border-radius:12px;border:1px solid #334863;background:#0c1422}
.save{display:none;width:100%;border:0;border-radius:12px;background:#daf4ec;color:#0e3d32;font-size:15px;font-weight:800;cursor:pointer;padding:13px 12px;margin-top:10px}.save:active{opacity:.7}
#note{font-size:12px;color:#9aadc5;margin:9px 1px 0;line-height:1.45}
[hidden]{display:none!important}
</style></head><body>
<main>
<section aria-label="上传区">
<h1>找不同</h1>
<label class="upload">＋ 上传游戏截图<input id="file" type="file" accept="image/*" aria-label="上传游戏截图"></label>
<div class="controls">
 <label class="field">总差异 <input id="total" type="number" min="1" max="40" value="15" inputmode="numeric"></label>
 <label class="field">已找到 <input id="marked" type="number" min="0" max="40" value="0" inputmode="numeric"></label>
</div>
<p id="status">上传后自动识别</p>
</section>
<section aria-label="结果区">
<div class="result-head"><h2>结果</h2><span class="count" id="counter"></span></div>
<div class="placeholder" id="placeholder">圈出的差异会显示在这里</div>
<img id="result" alt="自动标出差异的上下两幅游戏画面">
<button type="button" class="save" id="save">保存圈图</button>
<p id="note" hidden></p>
</section>
</main>
<script>
'use strict';(()=>{
 const $=id=>document.getElementById(id);
 const state={img:null,url:null,blob:null,timer:0,task:0,greenSuggested:0,greenEdited:false,found:null};
 const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
 const nextFrame=()=>new Promise(r=>setTimeout(r,20));
 const countValue=(id,defaultValue)=>clamp(Number.isFinite(Number($(id).value))?Math.round(Number($(id).value)):defaultValue,0,40);
 function message(text){$('status').textContent=text;}
 function schedule(ms=120){clearTimeout(state.timer);if(state.img)state.timer=setTimeout(()=>analyze(),ms);}
 function loadImage(f){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(f),image=new Image();image.onload=()=>{URL.revokeObjectURL(u);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('图片读取失败'))};image.src=u;});}
 $('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const task=++state.task;clearTimeout(state.timer);$('result').style.display='none';$('placeholder').hidden=false;$('save').style.display='none';$('note').hidden=true;$('counter').textContent='';state.img=null;message('正在读取图片…');try{const img=await loadImage(f);if(task!==state.task)return;state.img=img;state.greenEdited=false;$('marked').value=0;message('正在识别…');schedule(10);}catch(err){message(err.message);}});
 for(const id of ['total','marked'])$(id).addEventListener('change',()=>{if(id==='marked')state.greenEdited=true;schedule(100)});
 for(const id of ['total','marked'])$(id).addEventListener('input',()=>{if(id==='marked')state.greenEdited=true;schedule(260)});

  function makeCanvas(w,h){const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;return canvas;}
  function getPixels(img,x,y,iw,ih,dw,dh){
    const c=makeCanvas(dw,dh),ct=c.getContext('2d',{willReadFrequently:true});
    ct.drawImage(img,x,y,iw,ih,0,0,dw,dh);
    return ct.getImageData(0,0,dw,dh).data;
  }
  // 5-pixel separable Gaussian blur, matching the desktop implementation's JPEG-noise filtering.
  function gaussianRGB(data,w,h){
    const count=w*h, out=new Uint8Array(count*3), k=[1,4,6,4,1];
    // Use a compact 16-bit intermediate to preserve the weighted sums.
    const acc=new Uint16Array(count*3);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let r=0,g=0,b=0;
      for(let kx=-2;kx<=2;kx++){
        const at=(y*w+clamp(x+kx,0,w-1))*4,wt=k[kx+2];
        r+=data[at]*wt;g+=data[at+1]*wt;b+=data[at+2]*wt;
      }
      const q=(y*w+x)*3;acc[q]=r;acc[q+1]=g;acc[q+2]=b;
    }
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let r=0,g=0,b=0;
      for(let ky=-2;ky<=2;ky++){
        const at=(clamp(y+ky,0,h-1)*w+x)*3,wt=k[ky+2];
        r+=acc[at]*wt;g+=acc[at+1]*wt;b+=acc[at+2]*wt;
      }
      const q=(y*w+x)*3;out[q]=r>>8;out[q+1]=g>>8;out[q+2]=b>>8;
    }
    return out;
  }
  function connected(mask,w,h,condition){
    const n=w*h,seen=new Uint8Array(n),q=new Int32Array(n),parts=[];
    for(let index=0;index<n;index++){
      if(!mask[index]||seen[index])continue;
      let head=0,tail=1;q[0]=index;seen[index]=1;
      let x0=w,y0=h,x1=-1,y1=-1;
      while(head<tail){
        const cur=q[head++],x=cur%w,y=(cur/w)|0;
        if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
        for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++){
          for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){
            const next=yy*w+xx;if(!seen[next]&&mask[next]){seen[next]=1;q[tail++]=next;}
          }
        }
      }
      const part={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,area:tail};
      if(!condition||condition(part))parts.push(part);
    }
    return parts;
  }
  function findGreenRings(data,w,h){
    const n=w*h, mask=new Uint8Array(n),scale=w/706;
    for(let i=0;i<n;i++){
      const p=4*i,r=data[p],g=data[p+1],b=data[p+2];
      if(g>165&&g-r>40&&g-b>38)mask[i]=1;
    }
    return connected(mask,w,h,p=>{
      const ww=p.w/scale,hh=p.h/scale,ratio=p.area/(p.w*p.h);
      return p.area/scale/scale>470&&ww>=48&&ww<=190&&hh>=52&&hh<=230&&ratio>=.11&&ratio<=.33;
    });
  }
  function createIgnored(dataA,dataB,w,h){
    const a=findGreenRings(dataA,w,h),b=findGreenRings(dataB,w,h),all=a.concat(b),ignored=new Uint8Array(w*h),s=w/706;
    for(const p of all){
      const cx=p.x+p.w/2,cy=p.y+p.h/2,rx=p.w/2+17*s,ry=p.h/2+17*s;
      const x0=Math.max(0,Math.floor(cx-rx)),x1=Math.min(w-1,Math.ceil(cx+rx));
      const y0=Math.max(0,Math.floor(cy-ry)),y1=Math.min(h-1,Math.ceil(cy+ry));
      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
        const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)ignored[y*w+x]=1;
      }
    }
    // Estimate unique green-ring locations from both scenes; touching circles may share one component.
    const unique=[];
    for(const p of all){const cx=p.x+p.w/2,cy=p.y+p.h/2;
      if(!unique.some(u=>Math.abs(u.x-cx)<18*s&&Math.abs(u.y-cy)<18*s))unique.push({x:cx,y:cy});
    }
    return {ignored,count:unique.length};
  }
  // Separable rectangular binary morphology: O(width*height) per stage.
  function morph(mask,w,h,rad,dilate){
    const hpass=new Uint8Array(w*h),result=new Uint8Array(w*h),span=2*rad+1;
    for(let y=0;y<h;y++){
      const row=y*w;let sum=0;
      for(let xx=0;xx<=Math.min(rad,w-1);xx++)sum+=mask[row+xx];
      for(let x=0;x<w;x++){
        hpass[row+x]=dilate?(sum>0?1:0):(x>=rad&&x+rad<w&&sum===span?1:0);
        const remove=x-rad;if(remove>=0)sum-=mask[row+remove];
        const add=x+rad+1;if(add<w)sum+=mask[row+add];
      }
    }
    for(let x=0;x<w;x++){
      let sum=0;for(let yy=0;yy<=Math.min(rad,h-1);yy++)sum+=hpass[yy*w+x];
      for(let y=0;y<h;y++){
        result[y*w+x]=dilate?(sum>0?1:0):(y>=rad&&y+rad<h&&sum===span?1:0);
        const remove=y-rad;if(remove>=0)sum-=hpass[remove*w+x];
        const add=y+rad+1;if(add<h)sum+=hpass[add*w+x];
      }
    }
    return result;
  }
  // Tiny alignment correction prevents one-pixel vertical offsets from becoming dozens of false alarms.
  function findAlignment(a,b,w,h){
    const stride=Math.max(3,Math.round(w/141)),edge=12,limit=3;
    let best={dx:0,dy:0,score:Infinity},atZero=Infinity;
    for(let dy=-limit;dy<=limit;dy++)for(let dx=-limit;dx<=limit;dx++){
      let total=0,n=0;
      for(let y=edge;y<h-edge;y+=stride)for(let x=edge;x<w-edge;x+=stride){
        const i=(y*w+x)*4,j=((y+dy)*w+x+dx)*4;
        const d=Math.max(Math.abs(a[i]-b[j]),Math.abs(a[i+1]-b[j+1]),Math.abs(a[i+2]-b[j+2]));
        total+=Math.min(d,45);n++;
      }
      const score=total/n;
      if(!dx&&!dy)atZero=score;
      if(score<best.score)best={dx,dy,score};
    }
    return atZero-best.score>=.35?best:{dx:0,dy:0,score:atZero};
  }
  function shiftPixels(src,w,h,dx,dy){
    if(dx===0&&dy===0)return src;
    const dst=new Uint8ClampedArray(src.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const from=(clamp(y+dy,0,h-1)*w+clamp(x+dx,0,w-1))*4;
      const to=(y*w+x)*4;
      dst[to]=src[from];dst[to+1]=src[from+1];dst[to+2]=src[from+2];dst[to+3]=255;
    }
    return dst;
  }
  function locate(dataA,dataB,w,h,threshold,minArea,ignore,maxSpots,fineDetails){
    const n=w*h,srcA=gaussianRGB(dataA,w,h),srcB=gaussianRGB(dataB,w,h);
    const green=ignore?createIgnored(dataA,dataB,w,h):{ignored:new Uint8Array(n),count:0};
    const changed=new Uint8Array(n);
    for(let i=0;i<n;i++){
      if(green.ignored[i])continue;const p=i*3;
      const dr=Math.abs(srcA[p]-srcB[p]),dg=Math.abs(srcA[p+1]-srcB[p+1]),db=Math.abs(srcA[p+2]-srcB[p+2]);
      if(Math.max(dr,dg,db)>threshold)changed[i]=1;
    }
    let post=morph(changed,w,h,1,false);post=morph(post,w,h,1,true);
    const rad=Math.max(3,Math.round(6*w/706));
    post=morph(post,w,h,rad,true);post=morph(post,w,h,rad,false);
    const parts=connected(post,w,h,p=>p.area>=minArea&&p.w>=8*w/706&&p.h>=8*w/706);
    // Reject clusters primarily hugging a previously covered green circle.
    const filtered=parts.filter(p=>{
      if(!ignore)return true;
      let contact=0,samples=0;
      for(let y=p.y;y<p.y+p.h;y+=3)for(let x=p.x;x<p.x+p.w;x+=3){
        if(post[y*w+x]){
          samples++;let near=false;
          for(let dy=-5;dy<=5&&!near;dy+=5)for(let dx=-5;dx<=5;dx+=5){
            const yy=y+dy,xx=x+dx;
            if(yy>=0&&yy<h&&xx>=0&&xx<w&&green.ignored[yy*w+xx]){near=true;break;}
          }
          if(near)contact++;
        }
      }
      return !samples||contact/samples<.15;
    });
    // Second pass for thin, low-contrast patterned differences. The first pass's
    // 3x3 opening deliberately deletes thin lines; a smaller closing-only pass
    // preserves them while requiring a compact cluster of many changed pixels.
    if(fineDetails){
      const gentle = new Uint8Array(n);
      const gentleThreshold=Math.max(17,Math.min(27,threshold-12));
      for(let i=0;i<n;i++){
        if(green.ignored[i])continue;
        const p=i*3;
        if(Math.max(Math.abs(srcA[p]-srcB[p]),Math.abs(srcA[p+1]-srcB[p+1]),Math.abs(srcA[p+2]-srcB[p+2]))>gentleThreshold)gentle[i]=1;
      }
      const fineRad=Math.max(2,Math.round(2.6*w/706));
      const detail=morph(morph(gentle,w,h,fineRad,true),w,h,fineRad,false);
      const minDetail=Math.max(55*(w/706)**2,minArea*.65);
      const details=connected(detail,w,h,p=>p.area>=minDetail&&p.w>=11*w/706&&p.h>=12*w/706&&p.w<160*w/706&&p.h<140*w/706);
      for(const d of details){
        // Reject detections lying on the existing green rings, or on the
        // larger candidates already identified by the stronger detector.
        let covered=0,contact=0,seen=0,signal=0;
        for(let y=d.y;y<d.y+d.h;y+=2)for(let x=d.x;x<d.x+d.w;x+=2){
          if(detail[y*w+x]){
            seen++;
            if(green.ignored[y*w+x])covered++;
            if(gentle[y*w+x])signal++;
            for(let iy=-7;iy<=7;iy+=7){
              for(let ix=-7;ix<=7;ix+=7){
                const xx=x+ix,yy=y+iy;
                if(xx>=0&&xx<w&&yy>=0&&yy<h&&green.ignored[yy*w+xx])contact++;
              }
            }
          }
        }
        if(!seen||covered/seen>.02||contact/seen>.20||signal<Math.max(12,26*(w/706)**2))continue;
        const dcx=d.x+d.w/2,dcy=d.y+d.h/2;
        const overlaps=filtered.some(p=>{
          const pcx=p.x+p.w/2,pcy=p.y+p.h/2;
          return Math.abs(dcx-pcx)<(d.w+p.w)/2+8*w/706&&Math.abs(dcy-pcy)<(d.h+p.h)/2+8*w/706;
        });
        if(!overlaps)filtered.push({...d,detail:true});
      }
    }
    filtered.sort((a,b)=>b.area-a.area);
    return {candidates:filtered.slice(0,maxSpots),markedCount:green.count};
  }
  function circle(ctx,p,scaleX,scaleY,offY){
    const cx=(p.x+p.w/2)*scaleX,cy=offY+(p.y+p.h/2)*scaleY;
    const rx=Math.max(20,p.w/2+10)*scaleX,ry=Math.max(20,p.h/2+10)*scaleY;
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.lineWidth=Math.max(4,6*scaleX);ctx.strokeStyle='#fff';ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.lineWidth=Math.max(2.7,3.6*scaleX);ctx.strokeStyle='#ff334f';ctx.stroke();
  }


 function progressCount(img){
  // Read the 15 game-progress indicators, not the overlapping green rings in the picture.
  const ratio=img.naturalWidth/img.naturalHeight;
  if(ratio<.40||ratio>.53)return null;
  const W=img.naturalWidth,H=img.naturalHeight;
  const bar=getPixels(img,0,H*370/1536,W,H*56/1536,706,56);
  let count=0;
  for(let j=0;j<15;j++){
   const cx=Math.round(20+47.5*j);let green=0;
   for(let y=14;y<35;y++)for(let x=cx-10;x<=cx+10;x++){
    if(x<0||x>=706)continue;const at=(y*706+x)*4;
    const r=bar[at],g=bar[at+1],b=bar[at+2];
    if(g>125&&g-r>35&&g-b>35)green++;
   }
   if(green>55)count++;
  }
  return count;
 }
 function distinctCandidates(candidates,w){
  const unique=[];
  for(const p of candidates){
   const cx=p.x+p.w/2,cy=p.y+p.h/2;
   const duplicate=unique.some(q=>{
    const x0=Math.max(p.x,q.x),x1=Math.min(p.x+p.w,q.x+q.w),y0=Math.max(p.y,q.y),y1=Math.min(p.y+p.h,q.y+q.h);
    const intersection=Math.max(0,x1-x0)*Math.max(0,y1-y0);
    const minBox=Math.min(p.w*p.h,q.w*q.h);
    const dx=Math.abs(cx-(q.x+q.w/2)),dy=Math.abs(cy-(q.y+q.h/2));
    return (minBox>0&&intersection/minBox>.35)||(dx<15*w/706&&dy<15*w/706);
   });
   if(!duplicate)unique.push(p);
  }
  return unique;
 }
 function crop(){const H=state.img.naturalHeight,W=state.img.naturalWidth;const t=Math.round(H*.279),b=Math.round(H*.589),ch=Math.round(H*.307);if(t+ch>H||b+ch>H||b<=t+ch-4)throw Error('截图上下画面位置不符合预设');return {W,H,t,b,ch};}
 async function analyze(){
  if(!state.img)return;
  const task=++state.task;
  message('正在识别…');$('counter').textContent='识别中';$('note').hidden=true;
  await nextFrame();
  try{
   const input=state.img,c=crop(),width=Math.min(706,c.W),height=Math.round(width*c.ch/c.W);
   const dataA=getPixels(input,0,c.t,c.W,c.ch,width,height),dataB=getPixels(input,0,c.b,c.W,c.ch,width,height);
   const alignment=findAlignment(dataA,dataB,width,height);
   const found=locate(dataA,shiftPixels(dataB,width,height,alignment.dx,alignment.dy),width,height,35,145*(width/706)**2,true,40,true);
   const candidates=distinctCandidates(found.candidates,width);
   if(task!==state.task)return;
   const progress=progressCount(input);
   state.greenSuggested=progress===null?found.markedCount:progress;
   if(!state.greenEdited)$('marked').value=state.greenSuggested;
   const total=countValue('total',15),existing=countValue('marked',0),needed=Math.max(0,total-existing),shown=candidates.slice(0,needed);
   const gap=Math.max(5,Math.round(c.W*.008)),out=makeCanvas(c.W,2*c.ch+gap),ctx=out.getContext('2d');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,out.width,out.height);
   ctx.drawImage(input,0,c.t,c.W,c.ch,0,0,c.W,c.ch);
   ctx.drawImage(input,0,c.b,c.W,c.ch,0,c.ch+gap,c.W,c.ch);
   for(const p of shown){circle(ctx,p,c.W/width,c.ch/height,0);circle(ctx,p,c.W/width,c.ch/height,c.ch+gap+alignment.dy*c.ch/height);}
   const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(Error('生成图片失败')),'image/png'));
   if(task!==state.task)return;
   if(state.url)URL.revokeObjectURL(state.url);state.blob=blob;state.url=URL.createObjectURL(blob);
   $('result').src=state.url;$('result').style.display='block';$('placeholder').hidden=true;$('save').style.display='block';
   $('counter').textContent=`红圈 ${shown.length} / 需补 ${needed}`;
   const missing=needed-shown.length;
   $('note').hidden=false;
   $('note').textContent=missing>0?`候选不足，还有 ${missing} 处未检测到。`:(needed===0?'目前不需要补圈。':'红圈为疑似差异，数量或位置不对可调整“已找到”。');
   message(`识别完成 · 已找到 ${state.greenSuggested} 处`);
  }catch(err){if(task===state.task){console.error(err);message(err.message||'识别失败');$('counter').textContent='';}}
 }
 $('save').addEventListener('click',async()=>{
  if(!state.blob)return;
  try{const file=new File([state.blob],'找不同.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file]});return;}}catch(e){if(e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=state.url;a.download='找不同.png';a.click();
 });
})();
</script></body></html>
