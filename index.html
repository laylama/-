<script>
'use strict';(()=>{
 const $=id=>document.getElementById(id);
 const levels=[{threshold:40,area:175},{threshold:35,area:145},{threshold:30,area:112},{threshold:25,area:82},{threshold:21,area:60},{threshold:18,area:43}];
 const state={img:null,url:null,blob:null,timer:0,task:0,level:0,shown:[],busy:false,progress:null,pendingRerun:false};
 const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
 const nextFrame=()=>new Promise(r=>setTimeout(r,25));
 function message(text){$('status').textContent=text;}
 function schedule(ms=80){clearTimeout(state.timer);if(state.img)state.timer=setTimeout(()=>analyze(false),ms);}
 function loadImage(f){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(f),image=new Image();image.onload=()=>{URL.revokeObjectURL(u);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('图片读取失败'))};image.src=u;});}
 $('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const task=++state.task;clearTimeout(state.timer);$('result').style.display='none';$('placeholder').hidden=false;$('actions').classList.remove('visible');$('note').hidden=true;$('counter').textContent='';state.img=null;state.shown=[];state.level=0;state.progress=null;message('正在读取图片…');try{const img=await loadImage(f);if(task!==state.task)return;state.img=img;state.progress=readProgress(img);message('正在识别…');schedule(10);}catch(err){message(err.message);}});
 $('more').addEventListener('click',()=>analyze(true));

  function makeCanvas(w,h){const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;return canvas;}
  function getPixels(img,x,y,iw,ih,dw,dh){
    const c=makeCanvas(dw,dh),ct=c.getContext('2d',{willReadFrequently:true});

  }
  // 5-pixel separable Gaussian blur, matching the desktop implementation's JPEG-noise filtering.
  function gaussianRGB(data,w,h){
    const count=w*h, out=new Uint8Array(count*3), k=[1,4,6,4,1];

    const acc=new Uint16Array(count*3);

      let r=0,g=0,b=0;
      for(let kx=-2;kx<=2;kx++){

    }
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let r=0,g=0,b=0;
      for(let ky=-2;ky<=2;ky++){
        const at=(clamp(y+ky,0,h-1)*w+x)*3,wt=k[ky+2];
        r+=acc[at]*wt;g+=acc[at+1]*wt;b+=acc[at+2]*wt;

      const q=(y*w+x)*3;out[q]=r>>8;out[q+1]=g>>8;out[q+2]=b>>8;
    }

  function connected(mask,w,h,condition){
    const n=w*h,seen=new Uint8Array(n),q=new Int32Array(n),parts=[];
    for(let index=0;index<n;index++){
      if(!mask[index]||seen[index])continue;
      let head=0,tail=1;q[0]=index;seen[index]=1;
      let x0=w,y0=h,x1=-1,y1=-1;
      while(head<tail){
        const cur=q[head++],x=cur%w,y=(cur/w)|0;
        if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
        for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++){
          for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){
            const next=yy*w+xx;if(!seen[next]&&mask[next]){seen[next]=1;q[tail++]=next;}
          }
        }
      }
      const part={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,area:tail};
      if(!condition||condition(part))parts.push(part);

  }
  function findGreenRings(data,w,h){
    const n=w*h, mask=new Uint8Array(n),scale=w/706;
    for(let i=0;i<n;i++){
      const p=4*i,r=data[p],g=data[p+1],b=data[p+2];

    }
    return connected(mask,w,h,p=>{
      const ww=p.w/scale,hh=p.h/scale,ratio=p.area/(p.w*p.h);
      return p.area/scale/scale>470&&ww>=48&&ww<=190&&hh>=52&&hh<=230&&ratio>=.11&&ratio<=.33;
    });
  }
  function createIgnored(dataA,dataB,w,h){
    const a=findGreenRings(dataA,w,h),b=findGreenRings(dataB,w,h),all=a.concat(b),ignored=new Uint8Array(w*h),s=w/706;
    for(const p of all){
      const cx=p.x+p.w/2,cy=p.y+p.h/2,rx=p.w/2+17*s,ry=p.h/2+17*s;
      const x0=Math.max(0,Math.floor(cx-rx)),x1=Math.min(w-1,Math.ceil(cx+rx));
      const y0=Math.max(0,Math.floor(cy-ry)),y1=Math.min(h-1,Math.ceil(cy+ry));
      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
        const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)ignored[y*w+x]=1;
      }
    }
    // Estimate unique green-ring locations from both scenes; touching circles may share one component.
    const unique=[];
    for(const p of all){const cx=p.x+p.w/2,cy=p.y+p.h/2;
      if(!unique.some(u=>Math.abs(u.x-cx)<18*s&&Math.abs(u.y-cy)<18*s))unique.push({x:cx,y:cy});
    }

  // Separable rectangular binary morphology: O(width*height) per stage.
  function morph(mask,w,h,rad,dilate){
    const hpass=new Uint8Array(w*h),result=new Uint8Array(w*h),span=2*rad+1;
    for(let y=0;y<h;y++){
      const row=y*w;let sum=0;
      for(let xx=0;xx<=Math.min(rad,w-1);xx++)sum+=mask[row+xx];
      for(let x=0;x<w;x++){
        hpass[row+x]=dilate?(sum>0?1:0):(x>=rad&&x+rad<w&&sum===span?1:0);

    }
    for(let x=0;x<w;x++){
      let sum=0;for(let yy=0;yy<=Math.min(rad,h-1);yy++)sum+=hpass[yy*w+x];
      for(let y=0;y<h;y++){
        result[y*w+x]=dilate?(sum>0?1:0):(y>=rad&&y+rad<h&&sum===span?1:0);

  // Tiny alignment correction prevents one-pixel vertical offsets from becoming dozens of false alarms.
  function findAlignment(a,b,w,h){
    const stride=Math.max(3,Math.round(w/141)),edge=12,limit=3;
    let best={dx:0,dy:0,score:Infinity},atZero=Infinity;
    for(let dy=-limit;dy<=limit;dy++)for(let dx=-limit;dx<=limit;dx++){
      let total=0,n=0;
      for(let y=edge;y<h-edge;y+=stride)for(let x=edge;x<w-edge;x+=stride){
        const i=(y*w+x)*4,j=((y+dy)*w+x+dx)*4;
        const d=Math.max(Math.abs(a[i]-b[j]),Math.abs(a[i+1]-b[j+1]),Math.abs(a[i+2]-b[j+2]));
        total+=Math.min(d,45);n++;
      }
      const score=total/n;
      if(!dx&&!dy)atZero=score;
      if(score<best.score)best={dx,dy,score};
    }
    return atZero-best.score>=.35?best:{dx:0,dy:0,score:atZero};
  }
  function shiftPixels(src,w,h,dx,dy){
    if(dx===0&&dy===0)return src;
    const dst=new Uint8ClampedArray(src.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const from=(clamp(y+dy,0,h-1)*w+clamp(x+dx,0,w-1))*4;
      const to=(y*w+x)*4;
      dst[to]=src[from];dst[to+1]=src[from+1];dst[to+2]=src[from+2];dst[to+3]=255;
    }
    return dst;
  }
  function locate(dataA,dataB,w,h,threshold,minArea,ignore,maxSpots,fineDetails){

      if(green.ignored[i])continue;const p=i*3;

    const filtered=parts.filter(p=>{
      if(!ignore)return true;
      let contact=0,samples=0;
      for(let y=p.y;y<p.y+p.h;y+=3)for(let x=p.x;x<p.x+p.w;x+=3){

  }
  function circle(ctx,p,scaleX,scaleY,offY){
    const cx=(p.x+p.w/2)*scaleX,cy=offY+(p.y+p.h/2)*scaleY;
    const rx=Math.max(20,p.w/2+10)*scaleX,ry=Math.max(20,p.h/2+10)*scaleY;

    ctx.lineWidth=Math.max(2.7,3.6*scaleX);ctx.strokeStyle='#ff334f';ctx.stroke();
  }


 // Read the actual progress dots from this game's screenshot; never assume 15.
 // If the row is absent or distorted, return null and do not cap the results.
 function readProgress(img){
  const W=img.naturalWidth,H=img.naturalHeight;
  if(W/H<.40||W/H>.55)return null;
  const data=getPixels(img,0,H*374/1536,W,H*37/1536,706,37);
  const zones=[];let start=-1;
  for(let x=0;x<=706;x++){
   let green=0,grey=0;
   if(x<706)for(const y of [4,6,8,10]){
    const i=(y*706+x)*4,r=data[i],g=data[i+1],b=data[i+2];
    if(g>155&&g-r>40&&g-b>38)green++;
    if(r>120&&g>160&&b>175&&b-r>28&&b-g>=8)grey++;
   }
   const active=Math.max(green,grey)>=3;
   if(active&&start<0)start=x;
   if(!active&&start>=0){zones.push([start,x-1]);start=-1;}
  }
  const merged=[];
  for(const [a,b] of zones){
   if(merged.length&&a-merged[merged.length-1][1]<=15)merged[merged.length-1][1]=b;
   else merged.push([a,b]);
  }
  const valid=merged.filter(([a,b])=>b-a>=8&&b-a<=37);
  if(valid.length<6||valid.length>30)return null;
  const mids=valid.map(([a,b])=>(a+b)/2);
  const spaces=mids.slice(1).map((v,i)=>v-mids[i]);
  const average=spaces.reduce((a,b)=>a+b,0)/spaces.length;
  if(average<18||average>110||spaces.some(v=>Math.abs(v-average)>average*.29))return null;
  if(mids[0]>65||mids[mids.length-1]<620)return null;
  let greenCount=0;
  for(const [a,b] of valid){
   const cx=Math.round((a+b)/2);let green=0;
   for(const y of [4,6,7,8]){
    const i=(y*706+cx)*4,r=data[i],g=data[i+1],bl=data[i+2];
    if(g-r>38&&g-bl>38)green++;
   }
   if(green>=3)greenCount++;
  }
  return {total:valid.length,found:greenCount,remaining:valid.length-greenCount};

 function distinctCandidates(candidates,w){
  const unique=[];
  for(const p of candidates){
   const cx=p.x+p.w/2,cy=p.y+p.h/2;
   const duplicate=unique.some(q=>{
    const x0=Math.max(p.x,q.x),x1=Math.min(p.x+p.w,q.x+q.w),y0=Math.max(p.y,q.y),y1=Math.min(p.y+p.h,q.y+q.h);

    return (minBox>0&&intersection/minBox>.35)||(dx<15*w/706&&dy<15*w/706);
   });
   if(!duplicate)unique.push(p);
  }

 function crop(){const H=state.img.naturalHeight,W=state.img.naturalWidth;const t=Math.round(H*.279),b=Math.round(H*.589),ch=Math.round(H*.307);if(t+ch>H||b+ch>H||b<=t+ch-4)throw Error('截图上下画面位置不符合预设');return {W,H,t,b,ch};}

 function samePlace(p,q,w){

 async function analyze(more){

  $('more').disabled=true;message(more?'正在查找遗漏…':'正在识别…');$('counter').textContent='识别中';
  await nextFrame();
  try{
   const img=state.img,c=crop(),w=Math.min(706,c.W),h=Math.round(w*c.ch/c.W);
   const dataA=getPixels(img,0,c.t,c.W,c.ch,w,h),dataB=getPixels(img,0,c.b,c.W,c.ch,w,h);
   const alignment=findAlignment(dataA,dataB,w,h);
   const alignedB=shiftPixels(dataB,w,h,alignment.dx,alignment.dy);

   for(let level=from;level<=maxLevel;level++){

    const candidates=distinctCandidates(found.candidates,w);

   }

   // One refinement adds at most three spots to keep low-confidence noise manageable.
   const remaining=state.progress?.remaining;
   const allowance=more?(remaining===undefined?3:Math.min(3,Math.max(1,remaining-state.shown.length))):remaining;
   const added=additions.slice(0,allowance===undefined?additions.length:allowance);
   for(const p of added){if(!state.shown.some(q=>samePlace(p,q,w)))state.shown.push(p);}
   const gap=Math.max(5,Math.round(c.W*.008));
   const out=makeCanvas(c.W,2*c.ch+gap),ctx=out.getContext('2d');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,out.width,out.height);
   ctx.drawImage(img,0,c.t,c.W,c.ch,0,0,c.W,c.ch);
   ctx.drawImage(img,0,c.b,c.W,c.ch,0,c.ch+gap,c.W,c.ch);
   for(const p of state.shown){circle(ctx,p,c.W/w,c.ch/h,0);circle(ctx,p,c.W/w,c.ch/h,c.ch+gap+alignment.dy*c.ch/h);}
   const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(Error('生成图片失败')),'image/png'));
   if(task!==state.task)return;
   if(state.url)URL.revokeObjectURL(state.url);
   state.blob=blob;state.url=URL.createObjectURL(blob);
   $('result').src=state.url;$('result').style.display='block';$('placeholder').hidden=true;$('actions').classList.add('visible');
   $('counter').textContent=`已圈出 ${state.shown.length} 处`;
   $('note').hidden=true;
   if(!more&&state.progress&&added.length<state.progress.remaining){$('note').hidden=false;$('note').textContent=`根据图中进度，可能还差 ${state.progress.remaining-added.length} 处，点击“少圈了 · 再找”继续检测。`;}
   else if(more&&added.length===0){$('note').hidden=false;$('note').textContent='更高灵敏度也没找到新位置，可换一张更清晰的截图。';}
   else if(more){$('note').hidden=false;$('note').textContent=`本次新增 ${added.length} 处疑似差异。`;}
   $('more').disabled=state.level>=maxLevel&&added.length===0;
   message(more?'已重新检测':(state.progress?`识别完成 · 图片进度 ${state.progress.found}/${state.progress.total}`:'识别完成'));
  }catch(err){if(task===state.task){console.error(err);message(err.message||'识别失败');$('counter').textContent='';}}
  finally{state.busy=false;if(state.level<levels.length-1)$('more').disabled=false; if(state.pendingRerun){state.pendingRerun=false;schedule(40);} }
 }
 $('save').addEventListener('click',async()=>{
  if(!state.blob)return;
  try{const file=new File([state.blob],'找不同.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file]});return;}}catch(e){if(e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=state.url;a.download='找不同.png';a.click();
 });
})();
</script></body></html>
